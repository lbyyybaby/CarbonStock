seed: 42

dataset:
  # Resolved relative to this repository, even if Hydra changes the run directory.
  data_root: ../../data/CarbonStock
  regions: NgocHien
  expected_channels: 14
  batch_size: 4
  num_workers: 4
  train_fraction: 0.8
  split_seed: 42
  min_height: 0.0
  max_height: 30.0

model:
  architecture: depth_anything
  encoder: vits
  in_channels: ${dataset.expected_channels}
  image_size: 252
  max_height: ${dataset.max_height}
  lr: 5.0e-6
  pretrained: true
  use_huggingface: true
  hf_model_path: offline_models/depth-any-canopy-small
  hf_local_files_only: true
  checkpoint_path: null

trainer:
  accelerator: gpu
  devices: 1
  max_epochs: 100
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  num_sanity_val_steps: 0
  enable_checkpointing: true
  enable_model_summary: false
  enable_progress_bar: true
  deterministic: false

# Do not create timestamped Hydra output folders for this console-only run.
hydra:
  output_subdir: null
  run:
    dir: .
