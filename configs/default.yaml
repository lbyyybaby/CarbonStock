seed: 42
output_dir: runs/agbd
run_test: false

early_stopping:
  enabled: false
  patience: 5
  min_delta: 0.1  # Validation RMSE improvement in Mg/ha.

dataset:
  # Resolved relative to this repository, even if Hydra changes the run directory.
  data_root: ../../data/CarbonStock/processed
  regions: null
  expected_channels: 14
  batch_size: 4
  num_workers: 4
  train_fraction: 0.6
  val_fraction: 0.2
  buffer_m: 1000.0
  split_crs: EPSG:32648
  target_scale_quantile: 0.95

model:
  architecture: depth_anything
  encoder: vits
  in_channels: ${dataset.expected_channels}
  image_size: 252
  lr: 5.0e-6
  pretrained: true
  use_huggingface: true
  hf_model_path: offline_models/depth-any-canopy-small
  hf_local_files_only: true
  checkpoint_path: null

trainer:
  accelerator: gpu
  devices: 1
  max_epochs: 100
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  num_sanity_val_steps: 0
  enable_checkpointing: true
  enable_model_summary: false
  enable_progress_bar: true
  deterministic: false

# Do not create timestamped Hydra output folders for this console-only run.
hydra:
  output_subdir: null
  run:
    dir: .
